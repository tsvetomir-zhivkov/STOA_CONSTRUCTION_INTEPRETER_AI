[project]
name = "stoa-translator"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = [
    "dotenv>=0.9.9",
    "google-genai>=2.33.0",
    "shapely>=2.1.2",
]

[tool.ruff]
line-length = 110
extend-exclude = ["eval/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["translator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
