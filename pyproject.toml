[project]
name = "stoa-translator"
version = "0.3.0"
requires-python = ">=3.10"
dependencies = [
    "dotenv>=0.9.9",
    "google-genai>=2.33.0",
    "shapely>=2.1.2",
    "ifcopenshell>=0.8.0",
    "jsonschema>=4.23",
    "numpy>=2",
    "trimesh>=4",
    "pymupdf>=1.24",
    "ezdxf>=1.3",
    "opencv-python-headless>=4.10",
    "pillow>=10",
    "scipy>=1.14",
    "pandas>=2.2",
    # pipes (pipe schematic analysis)
    "networkx",
    "scikit-image",
    "sknw",
]

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.9"]
# pipes: detector training/inference runs on Modal (pipes/modal_pipes.py); not needed locally
pipes-gpu = ["ultralytics", "sahi"]

[tool.ruff]
line-length = 110
extend-exclude = ["eval/fixtures", "pipes/schema"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"pipes/**" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["translator", "pipes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
