[project]
name = "stoa-translator"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = [
    "dotenv>=0.9.9",
    "google-genai>=2.33.0",
    "numpy",
    "opencv-python-headless",
    "shapely>=2.1.2",
    "networkx",
    "ezdxf",
    "scikit-image",
    "sknw",
    "ultralytics",
    "sahi",
]

[tool.ruff]
line-length = 110
extend-exclude = ["eval/fixtures", "pipes/schema"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["translator", "pipes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
